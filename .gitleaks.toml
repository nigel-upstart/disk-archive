title = "disk-archive: defaults plus exact synthetic-only exceptions"

[extend]
useDefault = true

# Exact full matches AND exact paths. No fixture directory or rule exclusions.
# The PEM matches span adjacent synthetic records because the default rule's
# minimum length skips their deliberately tiny non-key bodies.
[[allowlists]]
description = "PEM delimiter grammar assertions only; no key body, exact match and path"
condition = "AND"
targetRules = ["private-key"]
regexTarget = "match"
paths = ['''^crates/verified/src/pem\.rs$''']
regexes = ['''^-----BEGIN RSA PRIVATE KEY-----y"\)\.is_some\(\)\);
        assert!\(begin\(b"-----BEGIN PRIVATE KEY-----"\)\.is_some\(\)\);
        assert!\(begin\(b"-----BEGIN rsa PRIVATE KEY-----$''']

[[allowlists]]
description = "Invented non-credential fixture; exact match and path only"
condition = "AND"
targetRules = ["private-key"]
regexTarget = "match"
paths = ['''^legacy/python/tests/test_redactor\.py$''']
regexes = [
  '''^-----BEGIN PRIVATE KEY-----\\\\nMIIfake\\\\n-----END PRIVATE KEY-----\\\\n"\}\\n'\n        b"-----BEGIN RSA PRIVATE KEY-----$''',
]

[[allowlists]]
description = "Invented non-credential fixture; exact match and path only"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "match"
paths = ['''^legacy/python/tests/test_redactor\.py$''']
regexes = ['''^JIRA_TOKEN=abc123def456 $''']

[[allowlists]]
description = "Invented non-credential fixture; exact match and path only"
condition = "AND"
targetRules = ["private-key"]
regexTarget = "match"
paths = ['''^legacy/python/fixtures/redactor/cases\.json$''']
regexes = [
  '''^-----BEGIN PRIVATE KEY-----\\nsynthetic-body\\n-----END PRIVATE KEY-----","keep":true\}\n",\n      "findings": \[\],\n      "drop_lines": \[\]\n    \},\n    \{\n      "id": "multiline-pem",\n      "input_hex": "before -----BEGIN RSA PRIVATE KEY-----$''',
]

[[allowlists]]
description = "Invented non-credential fixture; exact match and path only"
condition = "AND"
targetRules = ["private-key"]
regexTarget = "match"
paths = ['''^legacy/python/fixtures/redactor/cases\.json$''']
regexes = [
  '''^-----BEGIN PRIVATE KEY-----\nsynthetic-body\nno terminator\n",\n      "findings": \[\],\n      "drop_lines": \[\]\n    \},\n    \{\n      "id": "drop-lines",\n      "input_hex": "keep\nsynthetic line to drop\nlast\n",\n      "findings": \[\],\n      "drop_lines": \[\n        2\n      \]\n    \},\n    \{\n      "id": "drop-precedes-pem",\n      "input_hex": "-----BEGIN PRIVATE KEY-----$''',
]
