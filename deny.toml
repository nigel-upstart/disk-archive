[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"
# Exceptions must name an owner, reason, tracking issue, and YYYY-MM-DD expiry.
ignore = []

[licenses]
confidence-threshold = 0.95
allow = ["MIT", "Apache-2.0", "ISC", "BSD-3-Clause", "Unicode-3.0"]
# Owner: maintainer; #5; expires 2026-11-21; permissive Zlib hash-table implementation.
exceptions = [{ crate = "foldhash@0.2.0", allow = ["Zlib"] }]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Add only explicitly reviewed duplicate versions, with an explanation and issue.
skip = [
  { crate = "base64@0.22.1", reason = "Owner: maintainer; #5; expires 2026-11-21; AWS histogram/mock API vs hyper transport API" },
  { crate = "block-buffer@0.10.4", reason = "Owner: maintainer; #5; expires 2026-11-21; AWS checksums vs current RustCrypto digest API" },
  { crate = "cpufeatures@0.2.17", reason = "Owner: maintainer; #5; expires 2026-11-21; AWS legacy hashes vs current RustCrypto CPU dispatch" },
  { crate = "crypto-bigint@0.5.5", reason = "Owner: maintainer; #5; expires 2026-11-21; AWS SigV4 vs current ECDSA API" },
  { crate = "crypto-common@0.1.7", reason = "Owner: maintainer; #5; expires 2026-11-21; AWS legacy digests vs current RustCrypto API" },
  { crate = "digest@0.10.7", reason = "Owner: maintainer; #5; expires 2026-11-21; AWS/config/mock legacy hashes vs current signing hashes" },
  { crate = "getrandom@0.2.17", reason = "Owner: maintainer; #5; expires 2026-11-21; AWS crypto APIs vs current temporary-file randomness" },
  { crate = "getrandom@0.3.4", reason = "Owner: maintainer; #5; expires 2026-11-21; Hickory rand API vs current temporary-file randomness" },
  { crate = "r-efi@5.3.0", reason = "Owner: maintainer; #5; expires 2026-11-21; target-specific getrandom ABI generations" },
  { crate = "rand_core@0.6.4", reason = "Owner: maintainer; #5; expires 2026-11-21; AWS SigV4 ECDSA vs current signing API" },
  { crate = "rand_core@0.9.5", reason = "Owner: maintainer; #5; expires 2026-11-21; Hickory rand vs current signing API" },
  { crate = "sha1@0.10.7", reason = "Owner: maintainer; #5; expires 2026-11-21; AWS/config/mock checksum APIs vs current AWS SigV4 hashes" },
  { crate = "syn@2.0.119", reason = "Owner: maintainer; #5; expires 2026-11-21; AWS older derives vs current serde derives" },
  { crate = "windows-sys@0.59.0", reason = "Owner: maintainer; #5; expires 2026-11-21; target-specific transfer-manager/native API vs current Tokio ABI" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/awslabs/aws-s3-transfer-manager-rs",
  "https://github.com/mongodb/kingfisher",
]
required-git-spec = "rev"
