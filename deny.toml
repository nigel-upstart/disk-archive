[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"
# Exceptions must name an owner, reason, tracking issue, and YYYY-MM-DD expiry.
ignore = [
  { id = "RUSTSEC-2026-0319", reason = "Owner: maintainer; #17; expires 2027-02-23; unmaintained anymap2 via mandatory Liquid; validation templates are disabled" },
  { id = "RUSTSEC-2026-0543", reason = "Owner: maintainer; #17; expires 2027-02-23; unmaintained chrono via s3s in the synthetic S3 mock dev graph; no patched release" },
]

[licenses]
confidence-threshold = 0.95
allow = ["MIT", "Apache-2.0", "ISC", "BSD-3-Clause", "Unicode-3.0"]
# Owner: maintainer; #17; expires 2027-02-23. Exact crates only; see docs/dependencies.md.
exceptions = [
  { crate = "bip39@3.0.0", allow = [
    "CC0-1.0",
  ] },
  { crate = "bitcoin_hashes@0.14.101", allow = [
    "CC0-1.0",
  ] },
  { crate = "hex-conservative@0.2.3", allow = [
    "CC0-1.0",
  ] },
  { crate = "kingfisher-rules@3.3.0", allow = [
    "CC-BY-SA-4.0",
  ] },
  { crate = "foldhash@0.2.0", allow = [
    "Zlib",
  ] },
  { crate = "zlib-rs@0.6.8", allow = [
    "Zlib",
  ] },
  { crate = "xxhash-rust@0.8.19", allow = [
    "BSL-1.0",
  ] },
  { crate = "libfuzzer-sys@0.4.13", allow = [
    "NCSA",
  ] },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Add only explicitly reviewed duplicate versions, with an explanation and issue.
skip = [
  { crate = "untrusted@0.7.1", reason = "Owner: maintainer; #17; expires 2027-02-23; Kingfisher aws-lc-rs parser API vs SDK rustls-webpki parser API" },
  { crate = "base64@0.22.1", reason = "Owner: maintainer; #17; expires 2027-02-23; tiktoken and archive APIs vs catalog/pem API" },
  { crate = "block-buffer@0.10.4", reason = "Owner: maintainer; #17; expires 2027-02-23; native build digest vs catalog digest" },
  { crate = "cpufeatures@0.2.17", reason = "Owner: maintainer; #17; expires 2027-02-23; native build SHA vs catalog SHA" },
  { crate = "crypto-common@0.1.7", reason = "Owner: maintainer; #17; expires 2027-02-23; native build digest vs catalog digest" },
  { crate = "digest@0.10.7", reason = "Owner: maintainer; #17; expires 2027-02-23; native build hashing vs catalog hashing" },
  { crate = "getrandom@0.2.17", reason = "Owner: maintainer; #17; expires 2027-02-23; ring RNG API in all-target metadata vs current rand RNG API" },
  { crate = "hashbrown@0.14.5", reason = "Owner: maintainer; #17; expires 2027-02-23; dashmap/clru/indexmap incompatible APIs" },
  { crate = "hashbrown@0.16.1", reason = "Owner: maintainer; #17; expires 2027-02-23; dashmap/clru/indexmap incompatible APIs" },
  { crate = "sha1@0.10.7", reason = "Owner: maintainer; #17; expires 2027-02-23; aws-config SHA-1 API vs catalog" },
  { crate = "sha2@0.10.9", reason = "Owner: maintainer; #17; expires 2027-02-23; native build hashing vs catalog" },
  { crate = "syn@2.0.119", reason = "Owner: maintainer; #17; expires 2027-02-23; Liquid and tracing proc macros vs current serde proc macros" },
  { crate = "thiserror@1.0.69", reason = "Owner: maintainer; #17; expires 2027-02-23; Vectorscan wrapper vs catalog derives" },
  { crate = "thiserror-impl@1.0.69", reason = "Owner: maintainer; #17; expires 2027-02-23; Vectorscan wrapper vs catalog derives" },
  { crate = "windows-sys@0.59.0", reason = "Owner: maintainer; #17; expires 2027-02-23; transfer manager Windows bindings vs catalog and Tokio bindings" },
  { crate = "faster-hex@0.10.1", reason = "Owner: maintainer; #17; expires 2027-02-23; gix-hash API vs gix-packetline 2.x hex API" },
  { crate = "lock_api@0.4.14", reason = "Owner: maintainer; #17; expires 2027-02-23; dashmap and parking_lot 0.12 API vs parking_lot 0.13" },
  { crate = "parking_lot@0.12.5", reason = "Owner: maintainer; #17; expires 2027-02-23; gix storage and SDK synchronization API vs Kingfisher and gix-parallel" },
  { crate = "parking_lot_core@0.9.12", reason = "Owner: maintainer; #17; expires 2027-02-23; dashmap and parking_lot 0.12 core API vs parking_lot 0.13" },
  { crate = "redox_syscall@0.5.18", reason = "Owner: maintainer; #17; expires 2027-02-23; target-specific parking_lot_core 0.9 vs 0.10 Redox APIs" },
  { crate = "core-foundation@0.9.4", reason = "Owner: maintainer; #5; expires 2027-02-23; Hickory system-configuration macOS DNS ABI vs rustls-native-certs security-framework ABI" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/awslabs/aws-s3-transfer-manager-rs",
  "https://github.com/mongodb/kingfisher",
]
required-git-spec = "rev"
