[package]
name = "disk-archive-scanner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "=0.23.1"
kingfisher-scanner = { version = "=4.1.0", git = "https://github.com/mongodb/kingfisher", rev = "98b67a0211b9818169cb0c3923619c00dd95c98b", default-features = false }
kingfisher-rules = { version = "=3.3.0", git = "https://github.com/mongodb/kingfisher", rev = "98b67a0211b9818169cb0c3923619c00dd95c98b", default-features = false, features = [
  "__scanner-internals",
] }
kingfisher-vectorscan = { version = "=0.1.4", features = ["build-from-source"] }
memchr = "2.8.0"
regex-automata = "0.4.18"
regex-syntax = "0.8.8"
zeroize = "1.8.2"

[dev-dependencies]
disk-archive-core = { path = "../core", version = "=0.1.0" }

[lints]
workspace = true
