[package]
name = "disk-archive-scanner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "=0.23.1"
kingfisher-scanner = { version = "=2.0.0", git = "https://github.com/mongodb/kingfisher", rev = "c0a65103432434b2e4f502d519ed25566faa282e", default-features = false }
kingfisher-rules = { version = "=2.0.0", git = "https://github.com/mongodb/kingfisher", rev = "c0a65103432434b2e4f502d519ed25566faa282e", default-features = false, features = [
  "__scanner-internals",
] }
kingfisher-vectorscan = { version = "=0.1.1", features = ["build-from-source"] }
memchr = "2.8.0"
regex-automata = "0.4.18"
regex-syntax = "0.8.8"
zeroize = "1.8.2"

[dev-dependencies]
disk-archive-core = { path = "../core", version = "=0.1.0" }

[lints]
workspace = true
