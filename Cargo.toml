[workspace]
members = ["crates/*"]
exclude = ["spikes", "vendor"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
repository = "https://github.com/nigel-upstart/disk-archive"

# Audited manifest-only patch: preserve immutable upstream admission/provenance.
[patch."https://github.com/awslabs/aws-s3-transfer-manager-rs"]
aws-sdk-s3-transfer-manager = { path = "vendor/transfer-manager/aws-sdk-s3-transfer-manager" }
s3-mock-server = { path = "vendor/transfer-manager/s3-mock-server" }

# The generated S3 service is exceptionally large; omit dependency debug symbols
# while retaining workspace-package debug/coverage information.
[profile.dev.package.aws-sdk-s3]
debug = 0

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(verus_only)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
print_stdout = "deny"
dbg_macro = "deny"
todo = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "deny"
unused_async = "deny"
