name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '4'
      VECTORSCAN_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install native scanner prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libboost-dev ragel pkg-config strace
      - name: Install pinned workspace Rust
        run: |
          pin=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$pin" --profile minimal --component clippy,rustfmt,llvm-tools-preview
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.15
      - name: Install isolated Verus
        run: bash scripts/verus-install.sh
      - run: task check
      - run: task ci:secrets
      - name: Audit planted native scanner with network denied
        run: bash scripts/scanner-offline.sh
      - name: Pinned no-verification comparison (names and counts only)
        run: bash scripts/scanner-parity.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyclonedx-sbom
          path: target/sbom/*.cdx.json
          if-no-files-found: error
  scanner-fuzz:
    name: Full-catalog scanner/core fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '4'
      VECTORSCAN_OFFLINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native prerequisites and separately pinned fuzz compiler
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential cmake libboost-dev ragel pkg-config
          rustup toolchain install nightly-2026-10-20 --profile minimal --component rust-src
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Build isolated fuzz target (no input or findings loaded)
        run: |
          cargo +nightly-2026-10-20 fetch --locked --manifest-path fuzz/Cargo.toml
          cargo +nightly-2026-10-20 fuzz build scanner_redactor
      - name: Fuzz actual scanner and core without exposing fuzzer output
        run: python3 scripts/scanner-fuzz.py
  verus:
    name: Isolated Verus integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install separate proof toolchain
        run: bash scripts/verus-install.sh
      - name: Prove production kernels and reject semantic mutations
        run: bash scripts/verus-verify.sh
