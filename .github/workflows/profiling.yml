name: Optional profiling

on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profiling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  features:
    name: Optional profiling feature build (${{ matrix.flavor }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        flavor: [stable, console]
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      VECTORSCAN_OFFLINE: '1'
      CARGO_TARGET_DIR: target/profiling-${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libboost-dev ragel pkg-config strace
      - name: Install pinned workspace Rust
        run: |
          pin=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$pin" --profile minimal
      - name: Select explicit console compiler configuration
        if: matrix.flavor == 'console'
        run: echo 'RUSTFLAGS=--cfg tokio_unstable' >> "$GITHUB_ENV"
      - name: Check no default exporter dependency
        run: python3 scripts/profile-default.py
      - name: Compile actual application and synthetic example (no profiling run on PRs)
        run: cargo check --locked -p disk-archive --all-targets --all-features
      - name: Audit completely inert profiling-enabled CLI dry-run
        if: matrix.flavor == 'stable'
        run: |
          python3 -B crates/archiver/tests/run.py --profiling --dry-run-audit
  artifacts:
    name: Synthetic diagnostic artifacts (${{ matrix.mode }}, manual only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        mode: [trace, heap, console, cpu]
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      VECTORSCAN_OFFLINE: '1'
      # Each mode has its own compiler/feature identity; never share an unstable
      # console or frame-pointer CPU cache with the normal release or full gate.
      CARGO_TARGET_DIR: target/profile-${{ matrix.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native prerequisites and perf
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libboost-dev ragel pkg-config linux-tools-common linux-tools-generic
      - name: Install pinned workspace Rust
        run: |
          pin=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$pin" --profile minimal --component llvm-tools-preview
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.15
      - name: Configure sampling only on this disposable runner
        if: matrix.mode == 'cpu'
        run: |
          sudo sysctl kernel.perf_event_paranoid=-1
          sudo sysctl kernel.kptr_restrict=0
          perf_bin=$(find /usr/lib/linux-tools -type f -name perf -print -quit)
          test -n "$perf_bin"
          mkdir -p "$RUNNER_TEMP/profile-bin"
          ln -s "$perf_bin" "$RUNNER_TEMP/profile-bin/perf"
          echo "$RUNNER_TEMP/profile-bin" >> "$GITHUB_PATH"
      - name: Install explicitly optional CPU tools
        if: matrix.mode == 'cpu'
        run: task doctor -- --profiling
      - name: Run bounded synthetic diagnostics (never AWS)
        env:
          PROFILE_MODE: ${{ matrix.mode }}
        run: task "profile:$PROFILE_MODE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # Default success() is intentional: no partial/failed diagnostic artifact.
        with:
          name: synthetic-diagnostic-profiles-${{ matrix.mode }}
          path: |
            profiles/**/trace.json
            profiles/**/heap.json
            profiles/**/console.json
            profiles/**/cpu.json
            profiles/**/cpu.svg
            profiles/**/run.json
          if-no-files-found: error
          retention-days: 3
