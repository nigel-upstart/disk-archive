version: '3'

vars:
  QUIET: bash scripts/quiet-run.sh --

tasks:
  setup:
    desc: Install pinned tools and hooks (requires Rust, mise, and native prerequisites)
    cmds:
      - mise install
      - mise exec -- lefthook install
      - mise exec -- task doctor
  doctor:
    cmds: ['{{.QUIET}} bash scripts/doctor.sh']
  fmt:
    desc: Check formatting without changing files
    cmds: ['{{.QUIET}} bash scripts/gates.sh fmt']
  lint:
    cmds: ['{{.QUIET}} bash scripts/gates.sh lint']
  test:
    cmds: ['{{.QUIET}} bash scripts/gates.sh test']
  verify:
    cmds: ["bash scripts/quiet-run.sh --success-pattern 'Production-source Verus|negative control rejected|Production kernel proofs' -- bash scripts/verify.sh"]
  bench:
    desc: Criterion confidence intervals for fixed-buffer microbenchmarks
    cmds: ['{{.QUIET}} cargo bench -p disk-archive-benchmarks --features components --bench criterion --locked']
  bench:build:
    desc: Build actual release collector and both microbenchmark harnesses
    cmds: ['{{.QUIET}} python3 -B bench/build.py {{.CLI_ARGS}}']
  bench:kernels:
    desc: Collect actual Linux Callgrind instruction and cache events
    cmds: ['{{.QUIET}} python3 -B bench/kernels.py {{.CLI_ARGS}}']
  bench:collect:
    desc: Actual Linux native pipeline, independent verification and resource gate
    cmds: ['{{.QUIET}} python3 -B bench/run.py {{.CLI_ARGS}}']
  bench:gate:
    desc: Compare collected actual measurements; never capture or raise a baseline
    cmds: ['{{.QUIET}} python3 -B bench/gate.py {{.CLI_ARGS}}']
  sbom:
    cmds: ['{{.QUIET}} bash scripts/sbom.sh']
  coverage:
    cmds: ['{{.QUIET}} bash scripts/gates.sh coverage']
  supply-chain:
    cmds: ['{{.QUIET}} bash scripts/gates.sh supply-chain']
  parity:
    cmds: ['{{.QUIET}} bash scripts/gates.sh parity']
  hook:commit:
    cmds:
      - task: fmt
      - task: lint
      - '{{.QUIET}} bash scripts/gates.sh secrets'
  check:
    desc: Full pre-push and CI backstop
    cmds:
      - task: doctor
      - task: hook:commit
      - task: test
      - task: coverage
      - task: supply-chain
      - task: verify
      - task: parity
      - task: sbom
  ci:secrets:
    cmds: ['{{.QUIET}} bash scripts/gates.sh ci-secrets']
  clean:
    cmds:
      - cargo clean
      - rm -rf .task-logs
